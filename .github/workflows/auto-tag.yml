name: Auto Tag on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tag]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, or start with v0.0.0 if no tags exist
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "Latest tag: $latest_tag"

      - name: Determine version bump
        id: version_bump
        run: |
          commit_message="${{ github.event.head_commit.message }}"
          latest_tag="${{ steps.get_tag.outputs.latest_tag }}"
          
          # Extract version numbers from tag (remove 'v' prefix)
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          
          # Default to patch increment
          bump_type="patch"
          
          # Check commit message for version bump indicators
          if echo "$commit_message" | grep -qi '\[major\]'; then
            bump_type="major"
          elif echo "$commit_message" | grep -qi '\[minor\]'; then
            bump_type="minor"
          elif echo "$commit_message" | grep -qi 'break\|breaking'; then
            bump_type="major"
          fi
          
          # Calculate new version
          case $bump_type in
            major)
              new_major=$((major + 1))
              new_minor=0
              new_patch=0
              ;;
            minor)
              new_major=$major
              new_minor=$((minor + 1))
              new_patch=0
              ;;
            patch)
              new_major=$major
              new_minor=$minor
              new_patch=$((patch + 1))
              ;;
          esac
          
          new_version="v${new_major}.${new_minor}.${new_patch}"
          
          echo "bump_type=$bump_type" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "Version bump: $bump_type ($latest_tag -> $new_version)"

      - name: Create and push tag
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_version="${{ steps.version_bump.outputs.new_version }}"
          commit_message="${{ github.event.head_commit.message }}"
          
          # Configure git with the token
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create tag message
          tag_message="Release $new_version
          
          Commit: ${{ github.sha }}
          Message: $commit_message
          
          Auto-generated by GitHub Actions"
          
          # Create and push tag
          git tag -a "$new_version" -m "$tag_message"
          
          # Use authenticated push
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin "$new_version"
          
          echo "tag_created=$new_version" >> $GITHUB_OUTPUT
          echo "Created and pushed tag: $new_version"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_created }}
          release_name: Release ${{ steps.create_tag.outputs.tag_created }}
          body: |
            ## Release ${{ steps.create_tag.outputs.tag_created }}
            
            **Commit:** ${{ github.sha }}
            **Version Bump:** ${{ steps.version_bump.outputs.bump_type }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Installation
            
            **Docker:**
            ```bash
            docker pull namanvashistha/limedb:${{ steps.create_tag.outputs.tag_created }}
            ```
            
            **Binary Download:**
            - [Linux AMD64](https://github.com/namanvashistha/limedb/releases/download/${{ steps.create_tag.outputs.tag_created }}/limedb-linux-amd64)
            - [macOS AMD64](https://github.com/namanvashistha/limedb/releases/download/${{ steps.create_tag.outputs.tag_created }}/limedb-darwin-amd64)
            - [Windows AMD64](https://github.com/namanvashistha/limedb/releases/download/${{ steps.create_tag.outputs.tag_created }}/limedb-windows-amd64.exe)
            
            **Proxmox LXC:**
            ```bash
            bash <(curl -s https://raw.githubusercontent.com/namanvashistha/limedb/main/proxmox/limedb_lxc.sh)
            ```
            
            ---
            *This release was automatically created by GitHub Actions*
          draft: false
          prerelease: false

      - name: Notify success
        run: |
          echo "✅ Successfully created tag and release: ${{ steps.create_tag.outputs.tag_created }}"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.create_tag.outputs.tag_created }}"