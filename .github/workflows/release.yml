name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip tag]')
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag_created }}
      should_release: ${{ steps.create_tag.outputs.tag_created != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, or start with v0.0.0 if no tags exist
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "Latest tag: $latest_tag"

      - name: Determine version bump
        id: version_bump
        # The commit message arrives via env, NOT via ${{ }} inside run:.
        # GitHub pastes ${{ }} into the script before bash parses it, so a
        # message containing backticks or $( ) executes as a command — this
        # step died with "build:: command not found" on exactly that. An env
        # var is expanded by the shell, not spliced into it.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}
        run: |
          commit_message="$COMMIT_MESSAGE"
          latest_tag="$LATEST_TAG"
          
          # Extract version numbers from tag (remove 'v' prefix)
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          
          # Default to patch increment
          bump_type="patch"
          
          # Check commit message for version bump indicators
          if echo "$commit_message" | grep -qi '\[major\]'; then
            bump_type="major"
          elif echo "$commit_message" | grep -qi '\[minor\]'; then
            bump_type="minor"
          elif echo "$commit_message" | grep -qi 'break\|breaking'; then
            bump_type="major"
          fi
          
          # Calculate new version
          case $bump_type in
            major)
              new_major=$((major + 1))
              new_minor=0
              new_patch=0
              ;;
            minor)
              new_major=$major
              new_minor=$((minor + 1))
              new_patch=0
              ;;
            patch)
              new_major=$major
              new_minor=$minor
              new_patch=$((patch + 1))
              ;;
          esac
          
          new_version="v${new_major}.${new_minor}.${new_patch}"
          
          echo "bump_type=$bump_type" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "Version bump: $bump_type ($latest_tag -> $new_version)"

      - name: Create and push tag
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NEW_VERSION: ${{ steps.version_bump.outputs.new_version }}
        run: |
          new_version="$NEW_VERSION"
          commit_message="$COMMIT_MESSAGE"
          
          # Configure git with the token
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create tag message
          tag_message="Release $new_version
          
          Commit: ${{ github.sha }}
          Message: $commit_message
          
          Auto-generated by GitHub Actions"
          
          # Create and push tag
          git tag -a "$new_version" -m "$tag_message"
          
          # Use authenticated push
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin "$new_version"
          
          echo "tag_created=$new_version" >> $GITHUB_OUTPUT
          echo "Created and pushed tag: $new_version"

      - name: Notify tag creation
        run: |
          echo "✅ Successfully created and pushed tag: ${{ steps.create_tag.outputs.tag_created }}"
          echo "🏷️ Tag: ${{ steps.create_tag.outputs.tag_created }}"
          echo "📦 The build job will now create binaries and GitHub release"

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [auto-tag]
    if: always() && (needs.auto-tag.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: limedb-linux-amd64
          # - goos: linux
          #   goarch: arm64
          #   output_name: limedb-linux-arm64
          # - goos: darwin
          #   goarch: amd64
          #   output_name: limedb-darwin-amd64
          # - goos: darwin
          #   goarch: arm64
          #   output_name: limedb-darwin-arm64
          # - goos: windows
          #   goarch: amd64
          #   output_name: limedb-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Determine tag
        id: determine_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="${{ needs.auto-tag.outputs.tag_created }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ steps.determine_tag.outputs.tag }}" -o ${{ matrix.output_name }} ./cmd/server/main.go

      - name: Generate Release Notes
        id: release_notes
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        # Same reason as the version-bump step: the commit message is data, so
        # it comes in through env rather than being spliced into the script.
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="${{ steps.determine_tag.outputs.tag }}"
          
          # Get the tag message which contains commit info
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")
          
          # Extract commit hash from tag message or use current commit
          COMMIT_HASH=$(echo "$TAG_MESSAGE" | grep "Commit:" | cut -d' ' -f2 || echo "${{ github.sha }}")
          
          # Get commit message from tag message or use current commit message
          if [[ -n "$TAG_MESSAGE" ]]; then
            COMMIT_MSG=$(echo "$TAG_MESSAGE" | sed -n '/Message:/,/Auto-generated/p' | head -n -2 | tail -n +2 | tr -d '\n')
          else
            COMMIT_MSG="${HEAD_COMMIT_MESSAGE:-Manual release}"
          fi
          
          # Determine version bump type
          BUMP_TYPE="patch"
          if echo "$COMMIT_MSG" | grep -qi '\[major\]\|breaking'; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qi '\[minor\]'; then
            BUMP_TYPE="minor"
          fi
          
          # Create release notes
          cat > release_notes.md << EOF
          ## Release $TAG
          
          **Commit:** $COMMIT_HASH
          **Version Bump:** $BUMP_TYPE
          
          ### Changes
          $COMMIT_MSG
          
          ### Installation
          
          **Binary Download:**
          - [Linux AMD64](https://github.com/${{ github.repository }}/releases/download/$TAG/limedb-linux-amd64)
          - [Linux ARM64](https://github.com/${{ github.repository }}/releases/download/$TAG/limedb-linux-arm64)
          - [macOS AMD64](https://github.com/${{ github.repository }}/releases/download/$TAG/limedb-darwin-amd64)
          - [macOS ARM64](https://github.com/${{ github.repository }}/releases/download/$TAG/limedb-darwin-arm64)
          - [Windows AMD64](https://github.com/${{ github.repository }}/releases/download/$TAG/limedb-windows-amd64.exe)
          
          **Docker:**
          \`\`\`bash
          docker pull namanvashistha/limedb:$TAG
          docker pull namanvashistha/limedb:latest
          \`\`\`
          
          **Proxmox LXC:**
          \`\`\`bash
          bash <(curl -s https://raw.githubusercontent.com/namanvashistha/limedb/main/proxmox/limedb_lxc.sh)
          \`\`\`
          
          ---
          *This release was automatically created by GitHub Actions*
          EOF
          
          echo "notes_created=true" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine_tag.outputs.tag }}
          files: ${{ matrix.output_name }}
          body_path: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' && 'release_notes.md' || '' }}
          draft: false
          prerelease: false

  docker-publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [auto-tag]
    if: needs.auto-tag.outputs.tag_created != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push node image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.auto-tag.outputs.tag_created }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.auto-tag.outputs.tag_created }}

      # The web UI has its own Dockerfile, so the repo produces TWO images.
      # docker-compose.homelab.yaml runs four nodes off the image above and the
      # UI off this one; without it that compose cannot come up.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ needs.auto-tag.outputs.tag_created }}
            ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.auto-tag.outputs.tag_created }}
