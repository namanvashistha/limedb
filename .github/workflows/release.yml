name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: limedb-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: limedb-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: limedb-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: limedb-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: limedb-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o ${{ matrix.output_name }} ./cmd/server/main.go

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.output_name }}
