[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limedb"
version = "0.1.0"
description = "Python SDK for the LimeDB distributed key-value store"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "namanvashistha", email = "namanvashistha15@gmail.com" }]
keywords = ["limedb", "key-value", "distributed", "database", "client", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database :: Front-Ends",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/namanvashistha/limedb"
Repository = "https://github.com/namanvashistha/limedb"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/limedb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
