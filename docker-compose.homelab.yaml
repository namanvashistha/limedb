# Deployed compose for the homelab box. Declared as a Komodo stack in
# namanvashistha/homelab -> komodo/syncs/projects.toml.
#
# This is NOT docker-compose.yml. That one is the dev compose: it builds from
# the Dockerfile and publishes ports to localhost. This one pulls the image
# this repo's CI publishes to ghcr.io, uses `expose:` rather than `ports:`
# (ingress is cloudflared -> caddy, so a host port would bypass Cloudflare
# Access and publish to the LAN), and carries the caddy labels that route
# limedb.namanvashistha.com.
#
# Komodo clones this repo to /etc/komodo/stacks/limedb/ and runs compose there
# under the project name `limedb` — which is what the volumes below are prefixed
# with. Renaming the stack renames the volumes and detaches the data silently.

name: limedb

services:
  node1:
    image: ghcr.io/namanvashistha/limedb:latest
    restart: unless-stopped
    expose:
      - "8484"
    volumes:
      - limedb_node1_data:/data
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node1:8484
      # Full initial member list: all listed peers auto-join the routing ring
      # at boot. Nodes added later join via the admin activate/bootstrap flow.
      - NODE_PEERS=http://node2:8484,http://node3:8484,http://node4:8484
      - DATA_DIR=/data

  node2:
    image: ghcr.io/namanvashistha/limedb:latest
    restart: unless-stopped
    volumes:
      - limedb_node2_data:/data
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node2:8484
      - NODE_PEERS=http://node1:8484,http://node3:8484,http://node4:8484
      - DATA_DIR=/data

  node3:
    image: ghcr.io/namanvashistha/limedb:latest
    restart: unless-stopped
    volumes:
      - limedb_node3_data:/data
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node3:8484
      - NODE_PEERS=http://node1:8484,http://node2:8484,http://node4:8484
      - DATA_DIR=/data

  node4:
    image: ghcr.io/namanvashistha/limedb:latest
    restart: unless-stopped
    volumes:
      - limedb_node4_data:/data
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node4:8484
      - NODE_PEERS=http://node1:8484,http://node2:8484,http://node3:8484
      - DATA_DIR=/data

  web:
    # Second image: the repo builds ./web from its own Dockerfile, so its CI
    # pushes two packages, not one.
    image: ghcr.io/namanvashistha/limedb-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - LIMEDB_SEED_URL=http://node1:8484
    depends_on:
      - node1
    networks:
      - default
      - caddy
    labels:
      caddy: http://limedb.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  caddy:
    external: true

volumes:
  limedb_node1_data:
  limedb_node2_data:
  limedb_node3_data:
  limedb_node4_data:
