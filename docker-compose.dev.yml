services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - node1_tmp:/app/tmp
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node1:8484
      - NODE_PEERS=http://node2:8484
      - OTEL_ENDPOINT=

  node2:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - node2_tmp:/app/tmp
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node2:8484
      - NODE_PEERS=http://node3:8484
      - OTEL_ENDPOINT=

  node3:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - node3_tmp:/app/tmp
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node3:8484
      - NODE_PEERS=http://node4:8484
      - OTEL_ENDPOINT=

  node4:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - node4_tmp:/app/tmp
    environment:
      - SERVER_PORT=8484
      - NODE_URL=http://node4:8484
      - NODE_PEERS=http://node1:8484
      - OTEL_ENDPOINT=

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app              # bind mount → next dev picks up file changes instantly
      - web_node_modules:/app/node_modules  # keep node_modules inside container
    environment:
      - LIMEDB_SEED_URL=http://node1:8484
    depends_on:
      - node1

volumes:
  go_cache:
  node1_tmp:
  node2_tmp:
  node3_tmp:
  node4_tmp:
  web_node_modules:
